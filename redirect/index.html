<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./redirect.css" />
    <title>Redirect</title>
    <link rel="icon" href="./../icon.png" />
</head>

<body>
    <div id="container">
        <p id="status_field"></p>
        <textarea id="result_field" readonly onclick="this.select()"></textarea>
        <button id="copy_btn" onclick="copyResult()">Copy</button>
        <p id="instructions_field"></p>
    </div>

    <script>
        const params = new URL(window.location.toLocaleString()).searchParams;
        const redirectResult = params.get("redirectResult");

        if (redirectResult) {
            document.getElementById("status_field").textContent = "Payment authorised";
            document.getElementById("result_field").value = redirectResult;
            document.getElementById("instructions_field").textContent = "Copy the string above, then go back to Telegram and tap Complete payment.";
        } else {
            document.getElementById("status_field").textContent = "No authorisation data found.";
            document.getElementById("instructions_field").textContent = "Make sure you arrived here from the payment flow.";
            document.getElementById("copy_btn").style.display = "none";
            document.getElementById("result_field").style.display = "none";
        }

        function copyResult() {
            navigator.clipboard.writeText(redirectResult).then(() => {
                document.getElementById("copy_btn").textContent = "Copied";
                setTimeout(() => document.getElementById("copy_btn").textContent = "Copy", 2000);
            });
        }
    </script>
</body>

</html>
